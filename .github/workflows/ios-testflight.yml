name: iOS TestFlight

on:
  workflow_dispatch:
    inputs:
      changelog:
        description: What testers should know about this build
        required: false
        default: Internal build from CI

jobs:
  testflight:
    name: Build and upload
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: false

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Write the signing configuration
        run: |
          cat > iosApp/Configuration/Config.xcconfig <<CONFIG
          TEAM_ID=${{ secrets.IOS_TEAM_ID }}
          BUNDLE_ID=dev.hawk0f.checkmates
          APP_NAME=CheckMates
          CONFIG

      - name: Upload to TestFlight
        working-directory: iosApp
        env:
          TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          APPLE_ID: ${{ secrets.IOS_APPLE_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_CONTENT: ${{ secrets.ASC_KEY_CONTENT }}
          BUILD_NUMBER: ${{ github.run_number }}
          CHANGELOG: ${{ inputs.changelog }}
        run: fastlane beta
