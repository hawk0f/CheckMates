name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  jvm:
    name: Shared, server, Android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Code style
        run: ./gradlew ktlintCheck --no-daemon

      - name: Shared engine tests
        run: ./gradlew :shared:jvmTest --no-daemon

      - name: Server tests
        run: ./gradlew :server:test --no-daemon

      - name: Client view-model and screenshot tests
        run: ./gradlew :composeApp:testAndroidHostTest -Proborazzi.test.verify=true --no-daemon

      - name: Release build with R8
        run: ./gradlew :androidApp:assembleRelease --no-daemon

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            shared/build/reports/tests
            server/build/reports/tests
            composeApp/build/reports/tests
            composeApp/build/outputs/roborazzi
          retention-days: 7

  ios:
    name: iOS compile and tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Compile the iOS framework sources
        run: ./gradlew :composeApp:compileKotlinIosSimulatorArm64 --no-daemon

      - name: Shared engine tests on the simulator target
        run: ./gradlew :shared:iosSimulatorArm64Test --no-daemon
