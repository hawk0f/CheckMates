services:
  chess-server:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./server-all.jar:/app/app.jar:ro
      - ./data:/app/data
      - ./fcm-key.json:/app/fcm-key.json:ro
    command: ["java", "-Xmx384m", "-jar", "app.jar"]
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      PUBLIC_BASE_URL: https://chess.hawk0f.icu
      PORT: "8080"
      DB_PATH: /app/data/chess.db
      FCM_CREDENTIALS: /app/fcm-key.json
