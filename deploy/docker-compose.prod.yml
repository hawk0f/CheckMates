services:
  chess-server:
    image: eclipse-temurin:21-jre
    restart: unless-stopped
    working_dir: /app
    volumes:
      - ./server-all.jar:/app/app.jar:ro
      - ./data:/app/data
      - ./fcm-key.json:/app/fcm-key.json:ro
    command: ["java", "-Xmx384m", "-jar", "app.jar"]
    ports:
      - "127.0.0.1:8090:8080"
    environment:
      PUBLIC_BASE_URL: https://chess.hawk0f.icu
      PORT: "8080"
      DB_PATH: /app/data/chess.db
      FCM_CREDENTIALS: /app/fcm-key.json
      ANDROID_CERT_FINGERPRINTS: "0D:80:6E:09:29:B8:3B:D3:26:5A:F5:4D:DE:AE:AC:6D:30:67:A4:E8:4E:C9:94:C1:51:82:E1:63:E9:F2:FC:EA,85:B4:ED:FF:67:3E:35:5F:B2:67:77:6E:A7:E6:15:40:4D:B9:16:9E:81:E9:24:F5:6B:58:9A:3F:84:5B:D0:18"
